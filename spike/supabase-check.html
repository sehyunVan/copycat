<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Supabase 연결 확인</title>
<!-- 계정·저장 동기화를 붙이기 전에 **파이프가 뚫렸는지만** 보는 판.
     게임을 한 줄도 안 건드린다 — 확인이 끝나면 이 파일은 지워도 된다.

     file:// 로 열면 안 된다. 크롬이 로컬 파일마다 다른 출처로 취급해서
     localStorage 와 CORS 가 둘 다 막힌다. 서버로 열 것:

       node spike/serve.js
       http://localhost:8123/spike/supabase-check.html            -->
<style>
  body{margin:0;padding:28px;background:#14110E;color:#EDE4D6;
       font:14px/1.7 system-ui,-apple-system,'Segoe UI',sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#9A8468;font-size:12.5px}
  .box{background:#1F1A15;border:1px solid #3A322A;border-radius:12px;padding:16px;margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #2A241E}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
       font-weight:800;font-size:12px;background:#3A322A;color:#9A8468}
  .row.ok .tag{background:#2C4A3A;color:#8FD3AC}
  .row.no .tag{background:#4A2C2C;color:#E39A9A}
  .msg{flex:1;min-width:0}
  .msg b{display:block;font-size:13px}
  .msg span{display:block;color:#9A8468;font-size:12px;word-break:break-all;white-space:pre-wrap}
  code{background:#2A241E;padding:1px 5px;border-radius:4px;font-size:12px}
  .hint{color:#9A8468;font-size:12.5px;margin-top:14px}
</style>
</head>
<body>
<h1>Supabase 연결 확인</h1>
<p class="sub">익명 로그인 → 저장 → 읽기. 셋 다 초록이면 서버 쪽 준비 끝.</p>
<div class="box" id="out"><div class="row"><span class="tag">…</span>
  <div class="msg"><b>기다리는 중</b><span>아래 두 값을 채우고 새로고침하세요.</span></div></div></div>
<div class="hint">
  값은 Supabase 대시보드 → <code>Settings → API</code>.
  <code>anon</code>(또는 publishable) 키만 씁니다 — <code>service_role</code> 키는 넣지 마세요.
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ── 여기 두 줄만 채우면 됩니다 ────────────────────────────── */
const SB_URL = 'https://uezoijircckenbvqgokp.supabase.co';   // 예: https://abcdefghijklmnop.supabase.co   (https:// 포함, 끝에 / 없이)
const SB_KEY = 'sb_publishable_gprIG9Og02bWxZMVTzDvvA_18nGaegX';   // eyJ... 또는 sb_publishable_...
/* ─────────────────────────────────────────────────────────── */

const out = document.getElementById('out');
out.innerHTML = '';
function line(state, title, detail){
  const d = document.createElement('div');
  d.className = 'row ' + (state || '');
  d.innerHTML = '<span class="tag">' + (state === 'ok' ? '✓' : state === 'no' ? '✕' : '…') + '</span>'
    + '<div class="msg"><b></b><span></span></div>';
  d.querySelector('b').textContent = title;
  d.querySelector('span').textContent = detail == null ? '' : String(detail);
  out.appendChild(d);
  return d;
}

(async () => {
  if (!SB_URL || !SB_KEY){
    line('no', '값이 비어 있습니다', '이 파일의 SB_URL · SB_KEY 두 줄을 채우고 새로고침하세요.');
    return;
  }
  if (!/^https:\/\/.+\.supabase\.co\/?$/.test(SB_URL.trim())){
    line('no', 'Project URL 모양이 이상합니다',
      'https:// 로 시작하고 .supabase.co 로 끝나야 합니다.\n지금 값: ' + SB_URL);
    return;
  }
  if (location.protocol === 'file:'){
    line('no', 'file:// 로 열려 있습니다',
      '크롬이 로컬 파일을 각각 다른 출처로 취급해서 로그인이 막힙니다.\n' +
      'node spike/serve.js 를 켜고 http://localhost:8123/spike/supabase-check.html 로 여세요.');
    return;
  }

  let sb;
  try { sb = supabase.createClient(SB_URL.trim().replace(/\/$/, ''), SB_KEY.trim()); }
  catch (e){ line('no', '클라이언트를 못 만들었습니다', e.message); return; }

  /* ① 익명 로그인 — Authentication 에서 Anonymous sign-ins 를 켜야 통과한다 */
  const { data: auth, error: e1 } = await sb.auth.signInAnonymously();
  if (e1 || !auth || !auth.user){
    line('no', '① 익명 로그인 실패', (e1 && e1.message) || '알 수 없음');
    line('', '확인할 것', 'Authentication → 로그인 방식에서 Anonymous sign-ins 토글이 켜져 있는지.');
    return;
  }
  const uid = auth.user.id;
  line('ok', '① 익명 로그인', uid);

  /* ② 내 저장 한 줄 올리기 — RLS 정책이 user_id = auth.uid() 를 요구한다 */
  const { error: e2 } = await sb.from('saves').upsert({
    user_id: uid, save: { hello: '사무실', at: new Date().toISOString() }, days: 1,
  });
  if (e2){
    line('no', '② 저장 실패', e2.message);
    line('', '확인할 것',
      'saves 표가 있는지, insert/update 정책이 auth.uid() = user_id 로 걸려 있는지.');
    return;
  }
  line('ok', '② 저장', 'saves 에 내 줄을 올렸습니다');

  /* ③ 다시 읽기 — **내 줄 하나만** 나와야 RLS 가 도는 것이다 */
  const { data: rows, error: e3 } = await sb.from('saves').select('*');
  if (e3){ line('no', '③ 읽기 실패', e3.message); return; }
  const mine = (rows || []).filter(r => r.user_id === uid).length;
  const others = (rows || []).length - mine;
  if (others > 0){
    line('no', '③ 남의 줄까지 보입니다 — RLS 가 안 켜져 있습니다',
      '내 줄 ' + mine + ' · 남의 줄 ' + others + '\n' +
      'SQL Editor 에서: alter table public.saves enable row level security;');
    return;
  }
  line('ok', '③ 읽기', '내 줄 ' + mine + '개만 보입니다 (RLS 정상)');
  line('ok', '전부 통과', '서버 쪽 준비가 끝났습니다. 이제 게임에 붙이면 됩니다.');
})().catch(e => line('no', '예상 못 한 오류', e && e.message));
</script>
</body>
</html>
