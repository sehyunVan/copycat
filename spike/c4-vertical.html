<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>c4 — 수직 활용</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script type="module">
/* c4 — 바닥이 아니라 위를 채운다.

   2D 도트에서는 못 하던 것이다. 위에서 내려다보는 격자에서는 벽 선반도 캣워크도
   천장 조명도 그릴 자리가 없었다. 3D 에서 제일 크게 얻는 건 이 축이다.

   그리고 게임적으로도 맞다 — 고양이 회사인데 고양이가 바닥으로만 다니는 건 이상하다.
   캣워크는 "여기 고양이가 산다"고 말하는 가장 싼 물건이다.
   길찾기 격자는 그대로다. 위 칸은 연출이고, 앉는 자리만 별도로 표시하면 된다. */
import { run } from './lib/office.js';

run({
  name: 'c4 · 수직 활용',
  note: '캣워크 + 벽 선반 + 펜던트 조명. 바닥 대신 위를 채운다. 2D 에서 못 하던 축.',
  room: { W:10, D:8, wallH:2.8 },
  camera: { az:0.72, el:0.50, pad:0.7 },
  floorAt: (x, z) => (x >= 6 && z >= 5) ? 0xE7BFB8 : ((x + z) % 2 ? 0xF3E9DE : 0xEBDCCF),

  build(c){
    const { LP, put } = c;

    /* --- 위쪽 --- */
    c.onWallN(LP.catwalk(4.2), 2.6, 1.75);
    c.onWallN(LP.catwalk(2.6), 7.6, 2.15);
    c.onWallW(LP.catwalk(3.4), 2.4, 1.95);
    c.onWallW(LP.wallShelf(1.4), 5.6, 1.45);
    c.onWallN(LP.wallShelf(1.3), 5.6, 1.30);
    c.onWallN(LP.wallArt(0.6, 0.45, 0xF0A9A0), 0.9, 1.35);
    c.onWallN(LP.wallClock(), 6.9, 2.55);
    c.onWallW(LP.wallArt(0.5, 0.6, 0xA8B8E0), 6.9, 1.95);

    c.lamp(put(LP.pendant(0.9), 3.0, 2.2, 0, 2.8));
    c.lamp(put(LP.pendant(1.1), 6.6, 2.2, 0, 2.8));
    c.lamp(put(LP.pendant(0.8), 8.0, 6.0, 0, 2.8));

    put(LP.catTower(), 9.2, 3.4, -0.6);
    put(LP.catTower(), 1.0, 6.9, 0.5);

    /* --- 바닥 --- */
    const pods = [c.pod(2.6, 1.4), c.pod(6.2, 1.4)];
    c.lamp(put(LP.lamp(), 3.7, 1.3, -0.4, 0.65));
    put(LP.mug(0xA8D3A0), 2.0, 1.3, 0, 0.67);
    put(LP.mug(0xF0A9A0), 5.6, 1.3, 0, 0.67);

    put(LP.rug(2.8, 2.2, 0xE7BFB8), 7.8, 6.2);
    put(LP.napBox(), 6.6, 6.4, 0.3);
    put(LP.cushion(0xA8B8E0), 8.6, 6.6, 0.2);
    put(LP.blanket(0xF0A9A0), 8.0, 7.2, -0.3);
    put(LP.coffee(), 0.8, 3.4, 0.4);
    put(LP.cooler(), 0.7, 4.6, 0.3);
    put(LP.shelf(), 4.6, 0.45);
    put(LP.docStack(5), 4.8, 4.4, 0.3);
    put(LP.catnip(), 9.2, 7.2, -0.4);
    put(LP.inbox(), 9.3, 5.2, -0.5);
    put(LP.plant(), 0.7, 0.8);
    put(LP.plant(), 9.3, 0.8, 0.4);
    put(LP.plant(), 3.4, 7.3, -0.2);
    put(LP.snackBowl(), 5.4, 7.2);

    pods.forEach((p, i) => {
      c.cat([0xC9A06A, 0xE8A657][i], p.position.x - 0.45, p.position.z + 1.05, Math.PI, 'sit', 0.44);
      c.cat([0xF2EDE4, 0x8C6A4A][i], p.position.x + 0.55, p.position.z + 1.05, Math.PI, 'sit', 0.44);
    });
    // 캣워크 위 — 3D 로 가면 생기는 자리
    c.cat(0x3B3733, 3.4, 0.30, 2.4, 'sit', 1.79);
    c.cat(0xD9C3A5, 0.30, 3.0, 1.2, 'sleep', 1.99);
    c.cat(0x6E5B4C, 6.6, 6.4, 0.4, 'sleep', 0.12);
    c.walker(0xC9A06A, 5.4, 5.4, 2.4, 3.6);
  },
});
</script>
</body>
</html>
