<div id="stage"><canvas id="cv"></canvas></div>

/* s6 — 3D 인 걸 숨기지 않고 "손으로 접은 종이 모형"으로 밀어붙인다.
   빛을 거의 하늘빛(hemi)으로만 주고 그림자를 옅게 깔고, 굵은 갈색 윤곽선을 얹는다.
   면이 평평할수록 좋아지는 방향이라 박스로 짠 로우폴리와 궁합이 제일 좋다.
   그리고 시간 변화를 "빛"이 아니라 "종이 색"으로 표현한다 — 저녁엔 크래프트지, 밤엔 남색 색지. */
