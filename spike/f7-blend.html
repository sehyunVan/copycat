<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>f7 — 종합 후보</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script type="module">
/* f7 — 앞의 것들에서 좋았던 축만 겹친 후보안.
     · 치비 비율 (f4) — 귀여움과 작은 창 가독성을 동시에
     · 깎은 모서리 (f3) — 파스텔이 "덜 그려진 것"으로 안 보이게
     · 아주 옅은 윤곽선 (f5 의 1/3 세기) — 밝은 배경에서 형태가 날아가지 않게
     · 낮은 각도의 원근 — 디오라마를 위에서 내려다보는 대신 옆에서 들여다본다

   윤곽선은 세게 넣으면 그림책이 되고, 아예 빼면 파스텔끼리 붙어 뭉갠다.
   그 사이를 찾는 게 이 파일의 목적이다. */
import { run } from './lib/vignette.js';
import { PASTEL, PASTEL_PANELS } from './lib/pastel.js';

run({
  name: 'f7 · 종합 후보',
  note: '치비 + 깎은 모서리 + 아주 옅은 윤곽선. 지금까지 중 가장 그럴듯한 조합.',
  ref: 'f3 + f4 + f5 를 겹친 것',
  tone: 'aces', exposure: 1.16,
  softShadow: 3,
  kit: {
    prim:'round', bevel:0.05, shading:'smooth', detail:1,
    cat: { head:1.45, leg:0.6, body:0.85, ear:1.25, tail:0.9 },
  },
  outline: { color:0x8A7A72, opacity:0.32, angle:22 },
  camera: { el:0.46, az:0.66, radius:3.5 },
  pal: PASTEL,
  panels: PASTEL_PANELS,
});
</script>
</body>
</html>
