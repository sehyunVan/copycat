<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>c2 — 원룸 밀집</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script type="module">
/* c2 — 중간 크기 방을 통로 한 칸만 남기고 채운다.

   지금 world.js 의 배치기는 가구 사이를 넉넉히 띄운다(freeAround·crowded 검사).
   그게 길찾기에는 안전하지만 화면은 휑해진다. 여기서는 반대로 밀어붙여서
   "빽빽한 게 아늑한 건지, 그냥 답답한 건지" 를 눈으로 확인한다.
   BFS 는 여전히 통해야 하므로 통로는 정확히 한 칸씩 남겼다. */
import { run } from './lib/office.js';

run({
  name: 'c2 · 원룸 밀집',
  note: '10×8, 통로는 한 칸만. 가구 간격을 최소로 밀었다. 아늑한가 답답한가.',
  room: { W:10, D:8, wallH:2.2 },
  camera: { az:0.72, el:0.60, pad:0.6 },
  floorAt: (x, z) => (x >= 6 && z >= 5) ? 0xE7D3C6 : ((x + z) % 2 ? 0xF3E9DE : 0xEBDCCF),

  build(c){
    const { LP, put } = c;

    put(LP.rug(3.0, 2.2, 0xE7BFB8), 7.4, 6.2);

    // 책상 섬 셋을 붙여 놓는다 — 사이 통로 한 칸
    const pods = [c.pod(2.2, 1.2), c.pod(5.4, 1.2), c.pod(2.2, 4.2)];
    put(LP.mug(0xF0A9A0), 1.6, 1.1, 0, 0.67);
    put(LP.mug(0xA8B8E0), 4.9, 1.0, 0, 0.67);
    put(LP.mug(0xA8D3A0), 2.9, 4.1, 0, 0.67);
    c.lamp(put(LP.lamp(), 3.3, 1.1, -0.4, 0.65));
    c.lamp(put(LP.lamp(), 6.5, 1.1, -0.4, 0.65));

    put(LP.coffee(), 0.7, 6.0, 0.5);
    put(LP.cooler(), 0.6, 4.9, 0.4);
    put(LP.shelf(), 3.6, 0.45);
    put(LP.shelf(), 7.6, 0.45);
    put(LP.catTower(), 9.2, 2.4, -0.6);
    put(LP.napBox(), 8.9, 4.4, 0.3);
    put(LP.plant(), 0.7, 0.8);
    put(LP.plant(), 9.3, 0.8, 0.4);
    put(LP.plant(), 0.7, 7.3, -0.3);
    put(LP.plant(), 6.6, 7.3, 0.2);
    put(LP.catnip(), 8.6, 7.2, -0.4);
    put(LP.catnip(), 9.3, 6.4, 0.3);
    put(LP.cardboard(true), 5.2, 7.2, 0.4);
    put(LP.docStack(6), 4.4, 5.6, 0.3);
    put(LP.docStack(4), 6.2, 3.6, -0.2);
    put(LP.inbox(), 9.3, 5.4, -0.5);
    put(LP.cushion(0xA8B8E0), 6.8, 6.4, 0.3);
    put(LP.blanket(0xF0A9A0), 7.9, 6.6, -0.2);
    put(LP.snackBowl(), 8.4, 5.6);

    c.onWallN(LP.whiteboard(1.5), 3.0, 1.35);
    c.onWallN(LP.wallArt(0.6, 0.45, 0xF0A9A0), 1.3, 1.55);
    c.onWallN(LP.wallArt(0.45, 0.55, 0xA8D3A0), 5.0, 1.60);
    c.onWallN(LP.wallClock(), 6.9, 1.65);
    c.onWallN(LP.wallShelf(1.3), 8.6, 1.45);
    c.onWallW(LP.wallShelf(1.4), 2.6, 1.50);
    c.onWallW(LP.wallArt(0.5, 0.5, 0xA8B8E0), 6.8, 1.55);

    pods.forEach((p, i) => {
      c.cat([0xC9A06A, 0xE8A657, 0x8C6A4A][i], p.position.x - 0.45, p.position.z + 1.05, Math.PI, 'sit', 0.44);
      if (i < 2) c.cat([0xF2EDE4, 0x6E5B4C][i], p.position.x + 0.55, p.position.z + 1.05, Math.PI, 'sit', 0.44);
    });
    c.cat(0x3B3733, 8.9, 4.4, 0.4, 'sleep', 0.12);
    c.walker(0xD9C3A5, 6.5, 5.0, 4.0, 2.9);
  },
});
</script>
</body>
</html>
