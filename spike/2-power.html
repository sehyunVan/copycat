<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스파이크 2 — 8시간 상주 비용</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="dom2d"></div></div>

<script type="module">
/* ============================================================
   스파이크 2 — 하루 종일 켜 두는 게임이 3D 를 감당하는가.

   절대 수치는 기계마다 다르니 의미가 없다. 필요한 건 비교값이다:
   지금의 DOM 2D 를 기준선으로 두고, 같은 사무실을 WebGL 로 그렸을 때
   프레임 비용과 배터리 소모가 몇 배가 되는지.

   배터리는 반드시 충전기를 뽑고 잰다. 최소 20분, 되도록 1시간.
   ============================================================ */
import * as THREE from 'three';
import { hud, frameStats, fmt } from './lib/hud.js';
import * as LP from './lib/lowpoly.js';

const H = hud('2 · 상주 비용');
const stage = document.getElementById('stage');
const canvas = document.getElementById('cv');
const dom2d = document.getElementById('dom2d');
Object.assign(dom2d.style, { position:'absolute', inset:'0', display:'none', overflow:'hidden' });

/* ---------- 설정 ---------- */
const CFG = {
  mode: 'gl-always',        // gl-always | gl-30 | gl-10 | gl-dirty | dom2d | idle
  tier: 1,                  // 0 작은 사무실 · 1 중간 · 2 냥타워
  cats: 12,
  shadow: true,
  instancedFloor: false,
};
const TIERS = [[12,10], [18,16], [26,22]];

/* ---------- 3D ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'low-power' });
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141922);
const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 200);
let world = null, cats = [], sun = null;

function build(){
  if (world) { scene.remove(world); disposeTree(world); }
  cats.forEach(c => scene.remove(c.root));
  cats = [];
  scene.clear();

  const l = LP.lights(scene, { span: 20, shadow: CFG.shadow });
  sun = l.sun;
  renderer.shadowMap.enabled = CFG.shadow;

  const [W, Hh] = TIERS[CFG.tier];
  world = new THREE.Group();

  if (CFG.instancedFloor) world.add(instancedFloor(W, Hh));
  else world.add(LP.room(W, Hh, { zoneAt:(x,z) => (x < W*0.3 && z > Hh*0.65) ? 1 : 0 }));
  if (CFG.instancedFloor){
    const shell = LP.room(W, Hh, {});
    shell.getObjectByName('floor').visible = false;
    world.add(shell);
  }

  // 책상 섬 — world.js 의 2칸 책상 배치를 눈대중으로 옮긴 것
  for (let z = 2; z <= Hh - 4; z += 3){
    for (let x = 2; x + 1 < W - 3; x += 4){
      const d = LP.desk(); d.position.set(x + 1, 0, z + 0.5); world.add(d);
      world.add(LP.monitor(x + 0.5, z + 0.3, 0.1));
      world.add(LP.papers(x + 1.5, z + 0.4));
      const c = LP.chair(0.1); c.position.set(x + 0.5, 0, z + 1.5); world.add(c);
      const c2 = LP.chair(-0.1); c2.position.set(x + 1.5, 0, z + 1.5); world.add(c2);
    }
  }
  // 벽 쪽 비품
  const props = [LP.plant, LP.shelf, LP.coffee, LP.cooler, LP.napBox, LP.inbox];
  for (let i = 0; i < 6 + CFG.tier * 4; i++){
    const p = props[i % props.length]();
    p.position.set(1 + (i * 3) % (W - 3) + 0.5, 0, (i % 2 ? 1 : Hh - 2) + 0.5);
    world.add(p);
  }
  scene.add(world);

  for (let i = 0; i < CFG.cats; i++){
    const c = LP.cat(CATFUR[i % CATFUR.length]);
    c.root.position.set(1 + Math.random() * (W - 2), 0, 1 + Math.random() * (Hh - 2));
    c.goal = null;
    c.setState(['idle','walk','sit','sleep'][i % 4]);
    scene.add(c.root);
    cats.push(c);
  }

  camera.position.set(W / 2, Math.max(W, Hh) * 0.95, Hh * 1.35);
  camera.lookAt(W / 2, 0, Hh / 2);
  sun.position.set(W / 2 + 8, 18, Hh / 2 + 6);
  sun.target.position.set(W / 2, 0, Hh / 2);
  sun.target.updateMatrixWorld();

  buildDom2d(W, Hh);
  H.set('사무실', `${W}×${Hh}`);
  resize();
  dirty = true;
}
const CATFUR = [0xC9A06A, 0x3B3733, 0xE8A657, 0xF2EDE4, 0x4A4640, 0x8C6A4A];

function instancedFloor(W, Hh){
  // 바닥 타일은 형태가 같다 — 한 번에 그린다. 드로우콜 차이를 보려고 켜 두는 스위치.
  const g = new THREE.BoxGeometry(1, 0.1, 1);
  const m = new THREE.MeshLambertMaterial({ color: LP.PAL.floor, flatShading:true });
  const inst = new THREE.InstancedMesh(g, m, W * Hh);
  inst.receiveShadow = true;
  const o = new THREE.Object3D();
  let i = 0;
  for (let z = 0; z < Hh; z++) for (let x = 0; x < W; x++){
    o.position.set(x + 0.5, -0.05, z + 0.5);
    o.updateMatrix();
    inst.setMatrixAt(i++, o.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  return inst;
}

function disposeTree(root){
  root.traverse(o => { if (o.isInstancedMesh) o.dispose(); });
}

/* ---------- DOM 2D 기준선 ----------
   지금의 copycat 과 같은 구조: 타일은 한 번 그리고, 액터만 매 프레임 transform. */
let domActors = [];
function buildDom2d(W, Hh){
  const TS = 32;
  dom2d.innerHTML = '';
  domActors = [];
  const tiles = document.createElement('div');
  tiles.style.cssText = `position:absolute;left:0;top:0;width:${W*TS}px;height:${Hh*TS}px`;
  let html = '';
  for (let z = 0; z < Hh; z++) for (let x = 0; x < W; x++)
    html += `<div style="position:absolute;left:${x*TS}px;top:${z*TS}px;width:${TS}px;height:${TS}px;
      background:${(x+z)%2 ? '#C9CBD4' : '#C2C4CE'}"></div>`;
  tiles.innerHTML = html;
  dom2d.appendChild(tiles);
  for (let i = 0; i < CFG.cats; i++){
    const a = document.createElement('div');
    a.style.cssText = `position:absolute;left:0;top:0;width:${TS}px;height:${TS}px;will-change:transform;
      background:${['#C9A06A','#3B3733','#E8A657','#F2EDE4'][i%4]};border-radius:6px;
      box-shadow:0 2px 0 #0003`;
    tiles.appendChild(a);
    domActors.push({ el:a, x:Math.random()*W, z:Math.random()*Hh, vx:0, vz:0 });
  }
}

/* ---------- 움직임 ---------- */
function step(dt){
  const [W, Hh] = TIERS[CFG.tier];
  if (CFG.mode === 'dom2d'){
    for (const a of domActors){
      if (Math.random() < 0.01 || (!a.vx && !a.vz)){
        const ang = Math.random() * Math.PI * 2;
        a.vx = Math.cos(ang) * 1.2; a.vz = Math.sin(ang) * 1.2;
      }
      a.x = Math.max(1, Math.min(W - 1, a.x + a.vx * dt));
      a.z = Math.max(1, Math.min(Hh - 1, a.z + a.vz * dt));
      a.el.style.transform = `translate(${(a.x*32).toFixed(1)}px,${(a.z*32).toFixed(1)}px)`;
    }
    return;
  }
  for (const c of cats){
    c.update(dt);
    if (c.state !== 'walk') continue;
    if (!c.goal || c.root.position.distanceTo(c.goal) < 0.2)
      c.goal = new THREE.Vector3(1 + Math.random() * (W - 2), 0, 1 + Math.random() * (Hh - 2));
    const dir = c.goal.clone().sub(c.root.position).normalize();
    c.root.position.addScaledVector(dir, dt * 1.1);
    const want = Math.atan2(dir.x, dir.z);
    let diff = want - c.root.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    c.root.rotation.y += diff * Math.min(1, dt * 6);
    dirty = true;
  }
}

/* ---------- 루프 ---------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const fs = frameStats(1000);
let last = performance.now(), frames = 0, dirty = true, lastRenderAt = 0;

function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);

  if (CFG.mode === 'idle') { fs.tick(); frames++; return; }
  if (CFG.mode === 'dom2d'){ report(fs.tick()); frames++; return; }

  const cap = CFG.mode === 'gl-30' ? 1000/30 : CFG.mode === 'gl-10' ? 1000/10 : 0;
  if (cap && now - lastRenderAt < cap) return;
  if (CFG.mode === 'gl-dirty' && !dirty && now - lastRenderAt < 1000) return;

  lastRenderAt = now;
  dirty = false;
  renderer.render(scene, camera);
  frames++;
  report(fs.tick());
}

function report(s){
  if (!s) return;
  H.set('fps', s.fps.toFixed(1), s.fps < 20 ? 'warn' : 'ok');
  H.set('frame avg / p95 / max', `${s.avg.toFixed(2)} / ${s.p95.toFixed(2)} / ${s.max.toFixed(1)} ms`);
  const i = renderer.info.render;
  H.set('draw call / 삼각형', CFG.mode.startsWith('gl') ? `${i.calls} / ${i.triangles.toLocaleString()}` : '—',
        i.calls > 900 ? 'warn' : '');
  H.set('DOM 노드', String(document.getElementsByTagName('*').length));
  if (performance.memory) H.set('JS heap', fmt.mb(performance.memory.usedJSHeapSize));
}

/* ---------- 장시간 표본 ---------- */
const samples = [];
let bat = null;
navigator.getBattery?.().then(b => {
  bat = b;
  const show = () => {
    H.set('배터리', `${(b.level*100).toFixed(1)}% ${b.charging ? '(충전 중 — 측정 무효)' : ''}`,
          b.charging ? 'warn' : 'ok');
  };
  b.addEventListener('levelchange', show);
  b.addEventListener('chargingchange', show);
  show();
}).catch(() => H.set('배터리', 'API 없음', 'warn'));

const t0 = performance.now();
let markFrames = 0, markT = t0;

setInterval(() => {
  const now = performance.now();
  const el = (now - t0) / 1000;
  const fps = (frames - markFrames) / ((now - markT) / 1000);
  markFrames = frames; markT = now;

  samples.push({
    t: +el.toFixed(1), mode: CFG.mode, cats: CFG.cats, tier: CFG.tier,
    shadow: CFG.shadow ? 1 : 0, fps: +fps.toFixed(2),
    heapMB: performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : '',
    battery: bat ? +(bat.level * 100).toFixed(2) : '',
    charging: bat ? (bat.charging ? 1 : 0) : '',
  });

  H.set('경과', fmt.hms(el));
  H.set('표본', String(samples.length));
  drain();
}, 10000);

/* 같은 모드로 이어진 구간에서만 기울기를 낸다 — 모드를 바꾸면 구간이 끊긴다. */
function drain(){
  if (!bat || bat.charging) return;
  const runs = new Map();
  let cur = null;
  for (const s of samples){
    if (!cur || cur.mode !== s.mode){ cur = { mode:s.mode, first:s, last:s }; runs.set(cur, 1); }
    cur.last = s;
  }
  const per = new Map();
  for (const r of runs.keys()){
    const dt = (r.last.t - r.first.t) / 3600;
    if (dt < 0.05) continue;                        // 3분 미만은 노이즈
    const d = (r.first.battery - r.last.battery) / dt;
    const a = per.get(r.mode) || { sum:0, w:0 };
    a.sum += d * dt; a.w += dt;
    per.set(r.mode, a);
  }
  const parts = [...per].map(([m, a]) => `${m} ${(a.sum / a.w).toFixed(1)}%/h`);
  if (parts.length) H.set('배터리 소모', parts.join(' · '));
}

/* ---------- 조작 ---------- */
const modes = ['gl-always','gl-30','gl-10','gl-dirty','dom2d','idle'];
const modeBtns = modes.map(m => H.btn(m, () => {
  CFG.mode = m;
  canvas.style.display = m === 'dom2d' ? 'none' : '';
  dom2d.style.display = m === 'dom2d' ? '' : 'none';
  modeBtns.forEach((b, i) => b.classList.toggle('on', modes[i] === m));
  H.log(`모드 → ${m}`);
  markFrames = frames; markT = performance.now();
}, m === CFG.mode));

H.btn('사무실 크기 ▸', b => {
  CFG.tier = (CFG.tier + 1) % 3;
  b.textContent = `사무실 ${TIERS[CFG.tier][0]}×${TIERS[CFG.tier][1]} ▸`;
  build();
});
H.btn('고양이 ▸', b => {
  CFG.cats = CFG.cats === 4 ? 12 : CFG.cats === 12 ? 20 : 4;
  b.textContent = `고양이 ${CFG.cats} ▸`;
  build();
});
H.btn('그림자', () => { CFG.shadow = !CFG.shadow; build(); return CFG.shadow; }, CFG.shadow);
H.btn('바닥 인스턴싱', () => { CFG.instancedFloor = !CFG.instancedFloor; build(); return CFG.instancedFloor; });
H.btn('CSV 내려받기', () => {
  const head = Object.keys(samples[0] || { t:0 });
  const csv = [head.join(','), ...samples.map(s => head.map(k => s[k]).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = `copycat-power-${samples.length}.csv`;
  a.click();
  H.ok(`표본 ${samples.length}개 저장`);
});

document.addEventListener('visibilitychange', () =>
  H.log(`visibility → ${document.visibilityState}`));

build();
loop();
H.log('충전기를 뽑고, 모드 하나당 최소 20분씩 돌린다. gl-always ↔ dom2d 를 번갈아 재면 배경 소모가 상쇄된다.');
</script>
</body>
</html>
