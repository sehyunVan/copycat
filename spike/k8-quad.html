<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>k8 — 네 발 · 납작 얼굴 · 조잡하게</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script type="module">
/* k8 — 확정된 방향으로 다시 세운 판.

   · 눈 = k7 ① + ⑦ 조합. 기본은 bean(하이라이트 있는 납작한 콩),
     **상태에 따라 갈린다** — 노는 중이면 웃는 눈 ^ ^, 일하면 뜬 눈, 자면 감은 눈.
     계기판의 [상태] 버튼을 눌러 idle → walk → sit → sleep 로 돌려볼 것.
   · 얼굴 = 앞뒤로 납작하게(headSz 0.76). 두꺼우면 정면에서 이목구비가 곡면을 타고
     흘러내려서 안 읽힌다. 납작해야 얼굴이 "면" 이 된다.
   · 네 발로 복귀.
   · 조잡하게 = 정이십면체 20면, 원뿔 4각, 기둥 5각, 꼬리 2마디.
     이건 미학만의 선택이 아니다 — 부품과 면을 줄이는 게 곧 드로우콜 예산이다.

   ①~⑧ 은 납작함과 조잡함의 정도를 흔든 것이다. 어디까지 눌러도 고양이인가. */
import { run } from './lib/catlab.js';

run({
  name: 'k8 · 네 발 · 납작 얼굴',
  note: '눈은 상태 연동(idle=^ ^ · sit=뜬 눈 · sleep=감은 눈). [상태] 버튼으로 확인.',
  cols: 8,
  gapX: 0.80,
  camera: { el: 0.16 },
  lookY: 0.30,
  variants: [
    { label: '① 새 기준' },
    { label: '② 더 납작',      headSz:0.62, headSx:1.24 },
    { label: '③ 덜 납작',      headSz:0.92, headSx:1.08 },
    { label: '④ 더 조잡',      headDetail:0, ears:'wedge', tailSeg:1, shine:false, nose:'none' },
    { label: '⑤ 덜 조잡',      crude:false, headDetail:1 },
    { label: '⑥ 머리 더 크게',  headR:0.265, bodyR:0.138 },
    { label: '⑦ 몸 길게',      bodySz:1.50, bodyR:0.135 },
    { label: '⑧ 다리 짧게',    legH:0.075, legR:0.068, bodySy:1.02 },
  ],
});
</script>
</body>
</html>
