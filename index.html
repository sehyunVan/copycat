<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: 아이폰에서 노치·홈 인디케이터 영역까지 화면으로 쓴다.
     그 몫은 style.css 가 env(safe-area-inset-*) 로 비켜 준다.
     maximum-scale: 두 손가락으로 화면 전체가 확대되면 배치가 무너진다 —
     확대는 카메라가 따로 갖고 있으므로 브라우저 줌은 필요 없다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171310">
<meta name="color-scheme" content="dark light">
<!-- 홈 화면에 얹었을 때(iOS) 브라우저 없이 전체화면으로 뜬다. 안드로이드는 manifest 가 한다. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copycat">
<title>Copycat — 캣닢 만드는 고양이 조직</title>
<link rel="stylesheet" href="style.css?v=13">
<!-- 3D 모듈을 **미리 내려받는다.** 모듈은 항상 지연 평가되므로 클래식 스크립트가 전부
     돈 뒤에야 실행되는데, 그 전에 파일이라도 와 있으면 기다리는 시간이 그만큼 줄어든다.
     (평가 순서는 안 바뀐다 — 바뀌면 R3 를 클래식 코드가 못 보고 순서 가정이 깨진다)
     배포본에서는 tools/pack-single.js 가 이 두 줄을 지운다: 모듈이 HTML 안에 접혀 들어가서
     가리킬 파일이 없고, 남겨 두면 404 가 난다. -->
<link rel="modulepreload" href="js/render3d.js?v=13">
<link rel="modulepreload" href="js/three/vendor/three.module.min.js">
<!-- 로고. **원본은 tools/logo.js 하나다** — 파비콘·상단바·앱 아이콘이 그 도형 목록을
     읽는다. 전에는 셋이 따로 적혀 있었고, 그래서 그림체를 eerie 로 바꿀 때
     로고만 안 따라왔다(저녁 사무실에 주황 스티커 하나가 남았다).
     파일이 아니라 데이터로 넣는 이유는 그대로 — 배포본에서 favicon.ico 404 가
     나던 유일한 오류였고, 탭 아이콘 하나 때문에 파일을 더 들고 다닐 이유가 없다. -->

<!-- ============================================================
     로딩 화면 — 렌더러가 올 때까지 덮는다.

     **스크립트가 만들지 않는다.** 이 판이 필요한 순간은 첫 페인트이고, 그때는
     클래식 스크립트도 아직 안 돌았다(모듈은 그 뒤다 — TODO 20번). JS 로 만들면
     정작 필요한 6초를 못 덮는다. 그래서 마크업에 있고, 기본이 「보임」이다.
     걷는 것은 js/ui.js 의 renderTiles 가 `body.r3ready` 를 걸어서 한다.

     고양이 그림과 스피너 자리는 style.css 의 LOADCAT 구간에 있다 —
     node tools/bake-loading-cat.js 가 써 넣는다(그림을 그리지 않는다는 19번의 규칙).
     ============================================================ -->
<div id="loadgate" aria-hidden="true">
  <div class="lcat">
    <!-- 12갈래 throbber. 도형 하나를 정의하고 열두 번 돌려 쓴다. -->
    <div class="lspin"><svg viewBox="0 0 100 100">
      <defs><rect id="lsp" x="45.2" y="6" width="9.6" height="26" rx="4.8"/></defs>
      <use href="#lsp" transform="rotate(0 50 50)"   opacity=".16"/>
      <use href="#lsp" transform="rotate(30 50 50)"  opacity=".24"/>
      <use href="#lsp" transform="rotate(60 50 50)"  opacity=".31"/>
      <use href="#lsp" transform="rotate(90 50 50)"  opacity=".39"/>
      <use href="#lsp" transform="rotate(120 50 50)" opacity=".46"/>
      <use href="#lsp" transform="rotate(150 50 50)" opacity=".54"/>
      <use href="#lsp" transform="rotate(180 50 50)" opacity=".62"/>
      <use href="#lsp" transform="rotate(210 50 50)" opacity=".69"/>
      <use href="#lsp" transform="rotate(240 50 50)" opacity=".77"/>
      <use href="#lsp" transform="rotate(270 50 50)" opacity=".84"/>
      <use href="#lsp" transform="rotate(300 50 50)" opacity=".92"/>
      <use href="#lsp" transform="rotate(330 50 50)" opacity="1"/>
    </svg></div>
  </div>
  <div class="lword">thimkning...</div>
</div>

<!-- stageui = 무대 우선 배치(사무실이 화면 전체, 패널은 그 위에). 빼면 3열로 돌아간다. -->
<div id="app" class="stageui">

  <div id="topbar">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div>
        <h1>Copycat</h1>
        <div class="tier" id="coTier"></div>
      </div>
    </div>

    <div class="stat"><span class="ico">🐟</span><div><b id="sAnchovy">0</b> <small id="sRate">+0</small></div></div>
    <div class="stat"><span class="ico">🐾</span><div><b id="sCats">0</b> <small id="lblCats">냥</small></div></div>
    <div class="stat pen" id="penChip"><span class="ico">🔍</span><div><b id="sPen">0</b> <small id="lblPen">혐의</small></div></div>

    <div class="qwrap">
      <div class="qhead"><span id="qLabel"></span><span id="qNum"></span></div>
      <div class="qbar"><i id="qFill"></i></div>
    </div>

    <div class="spacer"></div>
    <!-- 위젯 모드에서는 이 묶음이 ⋯ 팝오버로 접힌다 (style.css 의 #app.compact #tools) -->
    <div id="tools">
      <button class="iconbtn" id="btnCard" title="근무 기록증">🪪</button>
      <button class="iconbtn" id="btnEdit" title="배치 모드">🛋️</button>
      <button class="iconbtn" id="btnSettings" title="설정">⚙️</button>
      <button class="iconbtn" id="btnHelp" title="사규">❓</button>
      <button class="iconbtn" id="btnReset" title="처음부터">🗑️</button>
    </div>
    <button class="iconbtn" id="btnMore" title="더보기">⋯</button>
    <button class="iconbtn" id="btnCompact" title="위젯 모드">🔳</button>
  </div>

  <div id="main">

    <!-- 결재함 -->
    <section class="panel" id="panelInbox">
      <div class="ph"><span>📋</span><h2 id="phInbox">결재함</h2><span class="sub" id="todoSub"></span></div>
      <div class="addbox">
        <input id="todoInput" placeholder="" maxlength="80" autocomplete="off">
        <div class="sizes" id="sizes">
          <button class="size on" data-size="s"></button>
          <button class="size" data-size="m"></button>
          <button class="size" data-size="l"></button>
        </div>
        <button class="addbtn" id="btnAdd"></button>
      </div>
      <div class="pb" id="todoList"></div>
    </section>

    <!-- 사무실 -->
    <section class="stagewrap">
      <!-- 좌우 패널 접기 손잡이 -->
      <button class="foldbtn L" id="btnFoldL" title="왼쪽 패널 접기">‹</button>
      <button class="foldbtn R" id="btnFoldR" title="오른쪽 패널 접기">›</button>
      <!-- 3D 일 때만 뜬다. 드래그로 시점을 고정한 뒤 추적으로 돌아가는 문. -->
      <button class="cambtn" id="btnCam" title="카메라" style="display:none">🎥</button>
      <div id="viewport" data-wait="사무실을 세우는 중">
        <div class="clockchip" id="clock"></div>
        <div class="raidbanner" id="raidBanner"></div>
        <!-- 무대. 도트 렌더러(#world 와 그 안의 타일·액터·서류 레이어)가 여기 형제로
             있었는데 2026-08-24 에 지웠다 — 남겨 둔 이유가 「PiP 에서 WebGL 이 사는지
             모른다」였고, 재 보니 산다(spike/pipcv.html). -->
        <canvas id="gl" style="display:none;position:absolute;inset:0;width:100%;height:100%"></canvas>
        <div id="editLayer" style="display:none"><div id="editSel"></div><div id="editGhost"></div></div>
        <div class="edithint" id="editHint" style="display:none"></div>
      </div>
      <!-- 위젯 모드에서는 이 줄이 독(dock)이 된다 — 서랍 두 개와 숫자 두 개만 남는다 -->
      <div class="stagefoot">
        <button class="dockbtn" id="dkInbox" title="결재함">📋<b id="dkTodo">0</b></button>
        <button class="dockbtn" id="dkBiz" title="경영">🐈</button>
        <span class="kv wide">🪑 <span id="lblWork">근무</span> <b id="fWork">0/0</b></span>
        <span class="kv">😺 <span id="lblMood">사기</span> <b id="fMood">100</b>%</span>
        <span class="kv">📄 <span id="lblDocs">대기</span> <b id="fDocs">0</b></span>
        <span class="kv wide">✅ <span id="lblDone">누적</span> <b id="fDone">0</b></span>
        <span id="ticker"></span>
      </div>
    </section>

    <!-- 경영 -->
    <section class="panel" id="panelBiz">
      <div class="tabs">
        <button class="tab on" data-tab="staff">🐈 직원</button>
        <button class="tab" data-tab="shop">🛒 비품</button>
        <button class="tab" data-tab="log">📰 사보</button>
      </div>
      <div class="pb" id="rightBody"></div>
    </section>

    <!-- 한 기둥(D3)과 모바일 탭 바(M4)가 **같은 줄**을 쓴다. 위에 붙으면 기둥의 머리,
         아래에 붙으면 탭 바다. 3열과 위젯 모드에서는 display:none 이다 — 그 둘은
         각자 이미 자기 항법(오른쪽 패널의 탭 / 아래 서랍)을 갖고 있다.
         🏢 는 무대가 한 화면을 차지하는 폰에서만 보인다. -->
    <nav id="colTabs">
      <button data-col="stage"><span>🏢</span><b id="ctStage">사무실</b></button>
      <button data-col="inbox" class="on"><span>📋</span><b id="ctInbox">결재함</b><i id="ctTodo"></i></button>
      <button data-col="staff"><span>🐈</span><b id="ctStaff">직원</b></button>
      <button data-col="shop"><span>🛒</span><b id="ctShop">비품</b></button>
      <button data-col="log"><span>📰</span><b id="ctLog">사보</b></button>
    </nav>

  </div>
</div>
